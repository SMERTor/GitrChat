name: gitrchat
description: GitrChat — private two-person messaging.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  video_player: ^2.9.2
  video_compress: ^3.1.3
  shared_preferences: ^2.3.3
  flutter_cache_manager: ^3.4.1
  uuid: ^4.5.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/gitrchat_icon.png"
  adaptive_icon_background: "#17112D"
  adaptive_icon_foreground: "assets/gitrchat_icon_foreground.png"
