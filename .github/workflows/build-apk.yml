name: Build GitrChat APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (required by the Android Lint runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The previous workflow kept an incomplete android/ directory.
      # Remove it so Flutter generates a complete settings.gradle + :app project.
      - name: Recreate Android platform cleanly
        shell: bash
        run: |
          set -euo pipefail

          ORG="com.gitrchat"
          OLD_GRADLE="android/app/build.gradle.kts"
          if [[ -f "$OLD_GRADLE" ]]; then
            FOUND_ID="$(python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text(errors="ignore") if p.exists() else ""
          for pattern in (r'applicationId\s*=\s*"([^"]+)"', r'namespace\s*=\s*"([^"]+)"'):
              m = re.search(pattern, s)
              if m:
                  print(m.group(1))
                  break
          PY
          )"
            if [[ -n "$FOUND_ID" ]]; then
              ORG="${FOUND_ID%.*}"
            fi
          fi

          echo "Using Android organization: $ORG"
          rm -rf android
          flutter create . --platforms=android --org "$ORG"

          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

          echo "Generated Android project files:"
          find android -maxdepth 2 -type f | sort

      - name: Add internet permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Android manifest not found: {manifest}")

          content = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in content:
              marker = "<application"
              if marker not in content:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              content = content.replace(marker, permission + "\n    " + marker, 1)
              manifest.write_text(content)
          PY

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Verify Gradle app module exists
        working-directory: android
        run: ./gradlew projects

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build-apk.log

          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::APK was not generated at $APK"
            find build -type f -name '*.apk' -print || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GitrChat-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GitrChat-build-log
          path: build-apk.log
          if-no-files-found: ignore
